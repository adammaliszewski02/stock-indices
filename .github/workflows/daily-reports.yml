name: Daily stock reports

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions uses UTC. 05:00 UTC is 06:00 CET during winter.
    - cron: '0 20 * * *'
      timezone: 'Europe/Paris'

permissions:
  contents: write

jobs:
  generate-reports:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Gemini API key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: test -n "$GEMINI_API_KEY"

      - name: Execute report batch
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: >-
          jupyter nbconvert --to notebook --execute all_tickers.ipynb
          --output all_tickers_executed.ipynb
          --ExecutePreprocessor.timeout=1800

      - name: Commit generated reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          import ast
          import json
          import subprocess
          from pathlib import Path

          notebook = json.loads(Path("all_tickers.ipynb").read_text(encoding="utf-8"))
          tickers = None
          for cell in notebook["cells"]:
              if cell["cell_type"] != "code":
                  continue
              tree = ast.parse("".join(cell["source"]))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Assign) and any(
                      isinstance(target, ast.Name) and target.id == "TICKERS"
                      for target in node.targets
                  ):
                      tickers = ast.literal_eval(node.value)
                      break
              if tickers is not None:
                  break
          if tickers is None:
              raise RuntimeError("Could not find TICKERS in all_tickers.ipynb")
          subprocess.run(["git", "add", "--all", "--", *tickers, "run_logs"], check=True)
          PY
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Update daily stock reports"
            git push
          fi
